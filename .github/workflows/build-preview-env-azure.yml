name: Preview Environment Pipeline (Azure Version)

on:
  workflow_dispatch:
    inputs:
      customer_name:
        description: 'Customer name'
        required: true
        type: string
      mapsunified_pr:
        description: 'Mapsunified PR'
        required: false
        type: string
      mapsdatabase_pr:
        description: 'Mapsdatabase PR'
        required: false
        type: string

env:
  AZURE_RESOURCE_GROUP: 'acme-dev-rg'
  AZURE_SQL_SERVER_NAME: 'preview-env-server.database.windows.net'
  AZURE_SQL_DB_NAME: 'PreviewEnvironmentDB'
  AZURE_CONTAINER_REGISTRY_NAME: 'inventdev'
  AZURE_STORAGE_ACCOUNT_NAME: 'acmedevstorageaccount'
  AZURE_BLOB_CONTAINER_NAME: 'acme-dev-container'
  AZURE_LOCATION: 'westeurope'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1.6.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Azure Account
        run: az account show

      - name: Install sqlcmd and dependencies
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo "/opt/mssql-tools/bin" >> $GITHUB_PATH

      - name: Run restore.ps1 on Azure Windows VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASS }}
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\Temp\restore.ps1"

      - name: Check if DB is online on Azure Windows VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASS }}
          script: |
            echo Checking if DB is online...
            :loop
            for /f "tokens=*" %%i in ('sqlcmd -S localhost -U previewenvuser -P "${{ secrets.AZURE_SQL_PASS }}" -Q "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = 'PreviewEnvironmentDB'"') do (
              echo %%i | findstr /C:"ONLINE" >nul
              if not errorlevel 1 (
                echo ✅ DB is ONLINE!
                goto :eof
              )
            )
            echo Waiting 5s...
            timeout /t 5 >nul
            goto loop

      - name: Generate strong MSSQL password
        id: pwgen
        run: |
          UPPER=$(tr -dc 'A-Z' </dev/urandom | head -c1)
          LOWER=$(tr -dc 'a-z' </dev/urandom | head -c1)
          DIGIT=$(tr -dc '0-9' </dev/urandom | head -c1)
          SYMBOL=$(echo '@#$%&*!' | fold -w1 | shuf | head -c1)
          REMAINING=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c8)
          PASSWORD="${UPPER}${LOWER}${DIGIT}${SYMBOL}${REMAINING}"
          PASSWORD=$(echo "$PASSWORD" | fold -w1 | shuf | tr -d '\n')
          echo "Generated password: $PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Create DB user on Azure Windows VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASS }}
          script: |
            set "PASSWORD=${{ steps.pwgen.outputs.password }}"
            echo Using password: %PASSWORD%
            set "ESCAPED_PASSWORD=%PASSWORD:'=''%"

            sqlcmd -S localhost -U previewenvuser -P "${{ secrets.AZURE_SQL_PASS }}" -b -r 1 -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = 'preview_env_user') CREATE LOGIN [preview_env_user] WITH PASSWORD = N'%ESCAPED_PASSWORD%'; ELSE ALTER LOGIN [preview_env_user] WITH PASSWORD = N'%ESCAPED_PASSWORD%';"
            if errorlevel 1 exit 1

            sqlcmd -S localhost -U previewenvuser -P "${{ secrets.AZURE_SQL_PASS }}" -d PreviewEnvironmentDB -b -r 1 -Q "IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'preview_env_user') CREATE USER [preview_env_user] FOR LOGIN [preview_env_user]; ALTER ROLE db_owner ADD MEMBER [preview_env_user];"
            if errorlevel 1 exit 1

  build-and-push-to-acr:
    if: ${{ github.event.inputs.mapsunified_pr != '' }}
    runs-on: ubuntu-latest
    env:
      VERSION: 0.${{ github.run_number }}
      ACR_NAME: inventpreviewenv
      ACR_REPOSITORY: mapsunified-preview-repository
    steps:
      - name: Checkout specific branch of another repository
        uses: actions/checkout@v3
        with:
          repository: inventanalytics/mapsunified
          ref: ${{ github.event.inputs.mapsunified_pr }}
          path: .
          token: ${{ secrets.TOKEN }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build and Tag Docker Image
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$ACR_REPOSITORY:$VERSION
          docker build -t $IMAGE .
          docker tag $IMAGE $ACR_NAME.azurecr.io/$ACR_REPOSITORY:latest
          echo "Docker image built and tagged"

      - name: Push Docker Images
        run: |
          docker push $ACR_NAME.azurecr.io/$ACR_REPOSITORY:$VERSION
          docker push $ACR_NAME.azurecr.io/$ACR_REPOSITORY:latest
          echo "Docker image pushed to ACR"

  # AWS'deki 'create-and-deploy-lambda' job'ının Azure karşılığı
  build-and-deploy-azure-function:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x' # Azure Functions için .NET 6.0'ı koruyabiliriz

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Build Azure Function Project
        run: |
          # maps-runner/template.yml yerine Azure Functions projenizin kök dizinine gidin
          # dotnet publish komutu, Azure Function'ı yayımlanmaya hazır hale getirir
          dotnet publish maps-runner/MapsRunner.csproj -c Release -o ./publish
          # Eğer bir proje dosyanız varsa, örneğin 'maps-runner/MapsRunner.csproj'
          # veya tüm solution'ı build etmek isterseniz:
          # dotnet build --configuration Release

      - name: Deploy Azure Function to Azure
        run: |
          # Azure Function App'inizi daha önce oluşturmuş olmalısınız.
          # Bu komut, yayımlanmış dosyaları Azure Function App'inize dağıtır.
          # Uygulama adını ve kaynak grubunu doğru şekilde ayarlayın.
          az functionapp publish --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name your-azure-function-app-name \
            --src "./publish" --runtime dotnet --os linux
          echo "Azure Function deployed!"